name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        env:
          
          IMAGE_NAME: ${{ github.repository }}
        run: |
          # Convert to lowercase using bash tr
          LOWER_IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          
          # Build
          docker build -t ghcr.io/${LOWER_IMAGE_NAME}:latest .
          
          # Push
          docker push ghcr.io/${LOWER_IMAGE_NAME}:latest